<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer gold circle -->
  <circle cx="100" cy="100" r="95" fill="#FFD700" stroke="#DAA520" stroke-width="3"/>
  
  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#DAA520" stroke-width="2"/>
  
  <!-- Head silhouette -->
  <g transform="translate(100, 100)">
    <!-- Face circle -->
    <circle cx="0" cy="-10" r="35" fill="#DAA520"/>
    
    <!-- Neck/shoulders -->
    <ellipse cx="0" cy="30" rx="40" ry="25" fill="#DAA520"/>
    
    <!-- Ear -->
    <ellipse cx="-25" cy="-10" rx="8" ry="12" fill="#DAA520"/>
    
    <!-- Facial features - eyes -->
    <circle cx="-12" cy="-15" r="3" fill="#8B6914"/>
    <circle cx="8" cy="-15" r="3" fill="#8B6914"/>
    
    <!-- Nose -->
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mouth -->
    <path d="M -8,5 Q 0,10 8,5" stroke="#8B6914" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative stars around the edge -->
  <text x="100" y="25" font-size="20" fill="#DAA520" text-anchor="middle">★</text>
  <text x="175" y="100" font-size="20" fill="#DAA520" text-anchor="middle">★</text>
  <text x="100" y="185" font-size="20" fill="#DAA520" text-anchor="middle">★</text>
  <text x="25" y="100" font-size="20" fill="#DAA520" text-anchor="middle">★</text>
</svg>
