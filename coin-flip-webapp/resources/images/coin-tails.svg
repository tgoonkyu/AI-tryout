<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer silver/gray circle -->
  <circle cx="100" cy="100" r="95" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="3"/>
  
  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#A9A9A9" stroke-width="2"/>
  
  <!-- Graffiti-style design -->
  <g transform="translate(100, 100)">
    <!-- Abstract shapes and lines -->
    <path d="M -40,-20 Q -20,-40 0,-30 T 40,-20" stroke="#808080" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -30,0 L -10,20 L 10,10 L 30,25" stroke="#808080" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -35,30 Q -10,40 15,30 T 40,35" stroke="#808080" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Circles and dots -->
    <circle cx="-20" cy="-25" r="8" fill="none" stroke="#808080" stroke-width="3"/>
    <circle cx="25" cy="-15" r="6" fill="none" stroke="#808080" stroke-width="3"/>
    <circle cx="-15" cy="10" r="4" fill="#808080"/>
    <circle cx="20" cy="20" r="5" fill="#808080"/>
    
    <!-- Zigzag pattern -->
    <path d="M -25,-5 L -20,5 L -15,-5 L -10,5 L -5,-5" stroke="#808080" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Star burst -->
    <g transform="translate(30, -35)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#808080" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#808080" stroke-width="2"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#808080" stroke-width="2"/>
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#808080" stroke-width="2"/>
    </g>
    
    <!-- Curved swoosh -->
    <path d="M -40,-10 Q -5,15 30,5" stroke="#808080" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Edge decoration dots -->
  <circle cx="100" cy="15" r="5" fill="#A9A9A9"/>
  <circle cx="185" cy="100" r="5" fill="#A9A9A9"/>
  <circle cx="100" cy="185" r="5" fill="#A9A9A9"/>
  <circle cx="15" cy="100" r="5" fill="#A9A9A9"/>
</svg>
