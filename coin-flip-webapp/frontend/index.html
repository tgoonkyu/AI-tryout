<!doctype html>

    <style>
      * {

      }
      button, a, [role="button"], input[type="button"], input[type="submit"], .MuiButton-root, .MuiIconButton-root, .MuiChip-root, .MuiMenuItem-root, span[role="button"], .MuiFormControlLabel-root, .MuiSwitch-root {

      }
      /* Increase clickable regions */
      button, .MuiButton-root {
        min-height: 48px !important;
        min-width: 48px !important;
        padding: 12px 24px !important;
      }
      .MuiIconButton-root {
        padding: 16px !important;
        min-width: 56px !important;
        min-height: 56px !important;
      }
      .MuiSwitch-root {
        padding: 12px !important;
      }
      .MuiChip-root {
        min-height: 40px !important;
        padding: 8px 16px !important;
      }
      a, [role="button"] {

        min-height: 44px !important;
        display: inline-flex !important;

      }
      .MuiTableRow-root {
        cursor: pointer;
      }

        background-color: rgba(0, 0, 0, 0.04) !important;
      }
      .MuiMenuItem-root {
        display: flex !important;
        align-items: center !important;
      }
      /* Improve header button text legibility */
      .MuiAppBar-root .MuiButton-root {
        font-weight: 600 !important;
        font-size: 1rem !important;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3) !important;
      }
      .MuiAppBar-root .MuiIconButton-root {
        font-size: 1.8rem !important;
      }
      .MuiAppBar-root .MuiSvgIcon-root {
        font-size: 1.8rem !important;
